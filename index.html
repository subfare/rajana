<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div id="bg-effects"></div>

<div class="screen active" id="intro">
  <h1 id="typeText"></h1>

  <div class="bubble-container">
    <button class="bubble" onclick="goLove()">hei christer!!</button>
    <button class="bubble danger" onclick="goFail()">hadet</button>

  <h1>Jeg elsker deg</h1>

  <div class="bubble-container">
    <button class="bubble" onclick="goLetters()">jeg elsker deg også</button>
    <button class="bubble danger" onclick="goFail()">jeg tror faktisk ikke at jeg elsker deg</button>
  </div>
</div>

    <div class="nav">
      <button onclick="prevLetter()">← Forrige</button>
      <button onclick="nextLetter()" id="nextBtn">Neste →</button>
    </div>
  </div>
</div>

<div class="screen" id="final">
  <h1 id="finalText"></h1>

  <div class="photo-placeholder">

  </div>
